<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>LínguaViva - Idiomas & Inclusão</title>
    <meta name="description" content="Plataforma inclusiva e moderna de ensino de Libras, Espanhol e Inglês nas modalidades EAD, Integral e Híbrida para alunos e professores." />
    <meta property="og:title" content="LínguaViva - Idiomas & Inclusão" />
    <meta property="og:description" content="Plataforma inclusiva e moderna de ensino de Libras, Espanhol e Inglês nas modalidades EAD, Integral e Híbrida para alunos e professores." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  </head>
  <body class="bg-[#F8F9FC] text-slate-900 antialiased selection:bg-[#5B2C9E] selection:text-white transition-colors duration-200">
    <div id="root"></div>

    <!-- VLibras: Plugin Oficial de Tradução em Libras do Governo Brasileiro -->
    <div vw class="enabled">
      <div vw-access-button class="active"></div>
      <div vw-plugin-wrapper>
        <div class="vw-plugin-top-wrapper"></div>
      </div>
    </div>
    <script src="https://vlibras.gov.br/app/vlibras-plugin.js"></script>
    <script>
      try {
        if (window.VLibras) {
          new window.VLibras.Widget('https://vlibras.gov.br/app');
        }
      } catch (e) {
        console.warn('VLibras não pôde ser iniciado externamente:', e);
      }
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
